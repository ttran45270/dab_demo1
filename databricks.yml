# YAML

bundle:
  name: temp-ice-dab-demo

include:
  - resources/*.yml

variables:
  catalog:
    description: Target Unity Catalog catalog
    # default: dev_catalog

  schema:
    description: Target schema
    # default: demo

targets:

  dev:
    mode: development
    presets:
      name_prefix: dev_

    #default: true
    workspace:
      host: https://dhs-ice-elaine-ero-pr.cloud.databricks.us
    variables:
      catalog: uip_eid_uc
      schema: ero_reporting_gold_eofy2026

  prod:
    presets:
      name_prefix: pro_

    mode: production
    variables:
      catalog: uip_eid_uc
      schema: ero_reporting_gold_eofy2026
    workspace:
      host: https://dhs-ice-elaine-ero-pr.cloud.databricks.us
      root_path: /Workspace/Users/thong.q.tran@associates.ice.dhs.gov/.bundle/${bundle.name}/${bundle.target}

    permissions:
    - user_name: thong.q.tran@associates.ice.dhs.gov
      level: CAN_MANAGE

