


resources:
  jobs:
    arrests_data_pipeline:
      name: arrests-pipeline-${bundle.target}
      description: Bronze Silver Gold ETL demo

      # Job parameters
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: processing_date
          default: "2026-11-03"
        - name: load_mode
          default: incremental

      # Serverless Python environment
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: []

      # Job settings
      max_concurrent_runs: 1
      timeout_seconds: 7200

      tags:
        project: dab-demo
        pipeline: bronze-silver-gold
        owner_team: data-engineering

      # Scheduled daily at 8 AM Eastern
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: America/New_York
        pause_status: PAUSED

      tasks:
        - task_key: bronze_arrest_360
          spark_python_task:
            python_file: ../src/bronze_arrest_360.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --date={{job.parameters.processing_date}}
              - --mode={{job.parameters.load_mode}}
          existing_cluster_id: 0923-143453-x4aruplw
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          description: Ingest source data

        - task_key: transaction_create_ft2
          spark_python_task:
            python_file: ../src/calculate_arrest_360.py
          environment_key: default
      

